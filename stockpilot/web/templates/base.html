<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}StockPilot India{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#667085; --line:#e4e7ec; --ok:#067647; --warn:#b54708; --bad:#b42318; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b2129; --text:#e7ebf0; --muted:#98a2b3; --line:#2b3440; --ok:#47cd89; --warn:#fdb022; --bad:#f97066; --accent:#7aa2ff; } }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:16px; }
  nav a { padding:6px 12px; border-radius:6px; color:var(--muted); text-decoration:none; }
  nav a.on { background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  h1 { margin:0 0 4px; } h2 { margin:0 0 10px; font-size:17px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { border-collapse:collapse; width:100%; } th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  pre { white-space:pre-wrap; margin:0; font:13px/1.5 ui-monospace, monospace; }
</style>
</head>
<body><main>
<h1>StockPilot India</h1>
<p class="muted">Research aid only &mdash; not investment advice. Setups are conditional; stop-losses do not guarantee loss limits.</p>
<nav>
  <a href="/" class="{{ 'on' if page == 'swing' }}">Swing</a>
  <a href="/long-term" class="{{ 'on' if page == 'long' }}">Long-term</a>
  <a href="/portfolio" class="{{ 'on' if page == 'portfolio' }}">Portfolio &amp; paper</a>
  <a href="/backtests" class="{{ 'on' if page == 'backtests' }}">Backtests</a>
</nav>
{% block body %}{% endblock %}
</main></body></html>
